<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Temple Sync - Income & Expense Application{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- COMPACT DEEP EMERALD HEADER BAR -->
    <header class="bg-temple-header shadow-sm" style="padding: 1.25rem 2%;">
        <div class="container-fluid">
            <div class="row align-items-center justify-content-center text-center">
                <div class="col-auto mb-2 mb-md-0">
                    <img src="{{ url_for('static', filename='image/logo.png') }}" 
                         alt="Temple Logo" 
                         class="img-fluid rounded-circle border shadow-sm"
                         style="height: 4.8rem; width: 4.8rem; object-fit: cover; border-color: #ffffff !important; border-width: 0.2rem !important;">
                </div>
                <div class="col-12 col-md-auto text-center">
                    <h2 class="fw-bold text-white mb-0 fs-3 text-center">Sri Ganesh Temple Society of British Columbia</h2>
                    <h6 class="text-light mb-0 fw-semibold text-center" style="font-size: 1.1rem; opacity: 0.9;">Income and Expense Application</h6>
                </div>
            </div>
        </div>
    </header>

    <!-- NAVIGATION NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-temple-accent shadow-sm py-1">
        <div class="container-fluid px-4">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1 fw-semibold">
                    <li class="nav-item">
                        <a class="nav-link text-dark px-3 {% if request.endpoint == 'daily_activity_page' %}active{% endif %}" href="{{ url_for('daily_activity_page') }}">
                            <i class="fa-solid fa-calendar-day me-1 text-success"></i> Daily Activity List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark px-3 {% if request.endpoint == 'dashboard_page' %}active{% endif %}" href="{{ url_for('dashboard_page') }}">
                            <i class="fa-solid fa-chart-line me-1 text-success"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark px-3 {% if request.endpoint == 'reports_page' %}active{% endif %}" href="{{ url_for('reports_page') }}">
                            <i class="fa-solid fa-file-invoice-dollar me-1 text-success"></i> Reports
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle btn btn-temple-maintenance btn-sm px-3 fw-semibold" href="#" id="maintenanceDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-gears me-1 text-success"></i> Maintenance
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="maintenanceDropdown">
                            <li>
                                <a class="dropdown-item py-2" href="{{ url_for('category_lookup_page') }}">
                                    <i class="fa-solid fa-layer-group me-2 text-success"></i>Category List
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item py-2" href="{{ url_for('activity_lookup_page') }}">
                                    <i class="fa-solid fa-list-check me-2 text-success"></i>Activity List
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item py-2" href="{{ url_for('maintenance_data_page') }}">
                                    <i class="fa-solid fa-database me-2 text-success"></i>Data Inspector
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN BODY CONTENT -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- JS DEPENDENCIES -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
